<tr><th>Format</th><td>65 questions (50 notées + 15 non notées, impossibles à distinguer) · QCM à 1 réponse ou à réponses multiples</td></tr>
<tr><th>Durée</th><td>90 minutes (~1 min 20 par question). Demandez l’aménagement <b>ESL +30 min</b> si l’anglais n’est pas votre langue maternelle (à faire <i>avant</i> de réserver, dans votre compte de certification).</td></tr>
<tr><th>Réussite</th><td>700 / 1000 (score pondéré). Aucune pénalité pour une mauvaise réponse → <b>ne laissez jamais de blanc</b>.</td></tr>
<tr><th>Coût / lieu</th><td>~100 USD · centre Pearson VUE ou en ligne (OnVUE) · disponible en français.</td></tr>
</table></div>
<div class="card"><h2>Les 4 domaines</h2>
<table>
<tr><th>Domaine</th><th>Poids</th><th>Ce qu’on teste</th></tr>
<tr><td>1. Concepts du cloud</td><td>24 %</td><td>Avantages du cloud, Well-Architected, CAF, migration, économie du cloud</td></tr>

<div class="tip">Le domaine 3 + 2 = <b>64 %</b> de l’examen. Si votre temps est limité, priorisez-les. L’examen teste surtout « <i>quel service pour quel besoin</i> » — pas la configuration.</div></div>
<div class="card"><h2>Plan de 14 jours (1–2 h/jour)</h2>
<table>
<tr><th>Jours</th><th>À faire</th></tr>
<tr><td>1–2</td><td>Fiche 1 (Concepts cloud) + flashcards du domaine 1</td></tr>

<tr><td>11</td><td>Examen blanc complet ici. Relire les explications de <b>toutes</b> les erreurs</td></tr>
<tr><td>12–13</td><td>Questions officielles gratuites : <a href="https://skillbuilder.aws/" target="_blank" rel="noopener">AWS Skill Builder</a> (« Official Practice Question Set CLF-C02 ») + cours « Cloud Practitioner Essentials » (gratuit)</td></tr>
<tr><td>14</td><td>Flashcards + Pièges seulement. Dormir. Viser ≥ 80 % aux examens blancs avant d’y aller.</td></tr>
</table>
<div class="tip">Référence officielle : le <a href="https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html" target="_blank" rel="noopener">guide d’examen CLF-C02</a> liste les services « dans le périmètre ». AWS fait évoluer ses offres (ex. Free Tier, plans de support) : vérifiez-y tout détail chiffré avant l’examen.</div></div>

V.d1 = `
<div class="card"><h2>Domaine 1 · Concepts du cloud <span class="pill">24 %</span></h2>
<h3>Le cloud computing</h3>
<p>Fourniture <b>à la demande</b> de ressources informatiques via Internet, avec <b>paiement à l’usage</b>.</p>
<table><tr><th>Modèle de service</th><th>Vous gérez</th><th>Exemple AWS</th></tr>
<tr><td>IaaS (infrastructure)</td><td>OS, applis, données</td><td>EC2, VPC, EBS</td></tr>
<tr><td>PaaS (plateforme)</td><td>Code et données seulement</td><td>Elastic Beanstalk, RDS</td></tr>
<tr><td>SaaS (logiciel)</td><td>Rien : vous utilisez</td><td>Amazon WorkMail, Gmail</td></tr></table>
<table><tr><th>Modèle de déploiement</th><th>Description</th></tr>
<tr><td>Cloud (tout dans le cloud)</td><td>Tout sur AWS</td></tr>
<tr><td>Hybride</td><td>Sur site + cloud connectés (ex. Direct Connect, Storage Gateway, Outposts)</td></tr>
<tr><td>Sur site / cloud privé</td><td>Votre propre datacenter, virtualisé</td></tr></table>

<h3>Les 6 avantages du cloud (à connaître par cœur)</h3><ol>
<li><b>Remplacer les dépenses d’investissement (CapEx) par des dépenses variables (OpEx)</b> — payer seulement ce qu’on consomme.</li>
<li><b>Bénéficier d’économies d’échelle massives</b> — AWS achète en gros → prix plus bas.</li>
<li><b>Arrêter de deviner la capacité</b> — on ajuste à la hausse/baisse.</li>
<li><b>Augmenter la vitesse et l’agilité</b> — ressources en minutes.</li>
<li><b>Arrêter de dépenser pour faire fonctionner des datacenters</b> — se concentrer sur ses clients.</li>
<li><b>Devenir mondial en quelques minutes</b> — régions partout.</li></ol>
<table><tr><th>Terme</th><th>Sens</th></tr>
<tr><td>Élasticité</td><td>Ajuster automatiquement les ressources à la demande (Auto Scaling)</td></tr>
<tr><td>Scalabilité</td><td>Capacité à grandir. <i>Verticale</i> = plus grosse machine ; <i>horizontale</i> = plus de machines</td></tr>
<tr><td>Haute disponibilité</td><td>Fonctionner malgré une panne : plusieurs <b>zones de disponibilité</b></td></tr>
<tr><td>Tolérance aux pannes</td><td>Continuer sans interruption même si un composant tombe</td></tr>
<tr><td>Agilité</td><td>Expérimenter vite et à faible coût</td></tr></table>

<h3>AWS Well-Architected Framework — 6 piliers</h3>
<table><tr><th>Pilier</th><th>Idée-clé</th></tr>
<tr><td>Excellence opérationnelle</td><td>Exécuter et surveiller ; automatiser ; petits changements fréquents et réversibles ; infrastructure as code</td></tr>
<tr><td>Sécurité</td><td>Protéger données et systèmes ; traçabilité ; moindre privilège ; chiffrer</td></tr>
<tr><td>Fiabilité</td><td>Se rétablir d’une panne ; multi-AZ ; scaler horizontalement ; tester la récupération</td></tr>
<tr><td>Efficacité des performances</td><td>Bon type/taille de ressource ; serverless ; global en minutes ; expérimenter</td></tr>
<tr><td>Optimisation des coûts</td><td>Éviter le gaspillage ; payer à l’usage ; mesurer l’efficacité</td></tr>
<tr><td>Durabilité</td><td>Minimiser l’impact environnemental ; maximiser l’utilisation</td></tr></table>
<div class="tip">Moyen mnémotechnique : <b>« O-S-F-P-C-D »</b>. L’outil <b>AWS Well-Architected Tool</b> (console) évalue gratuitement une charge de travail selon ces piliers.</div>

<h3>AWS Cloud Adoption Framework (CAF) — 6 perspectives</h3>
<table><tr><th>Capacités métier</th><th>Capacités techniques</th></tr>
<tr><td><b>Business</b> (stratégie, ROI) · <b>People</b> (culture, compétences, formation) · <b>Governance</b> (risques, budgets, gestion de programme)</td><td><b>Platform</b> (architecture, infra) · <b>Security</b> (IAM, détection, protection) · <b>Operations</b> (surveillance, incidents, continuité)</td></tr></table>
<p class="mute">Bénéfices du CAF : réduction des risques métier, amélioration ESG, croissance des revenus, efficacité opérationnelle. Phases : Envision → Align → Launch → Scale.</p>

<h3>Stratégies de migration — les 7 R</h3>
<table><tr><th>R</th><th>Signification</th></tr>
<tr><td>Rehost</td><td>« Lift and shift » : déplacer tel quel (ex. vers EC2) — <i>AWS Application Migration Service</i></td></tr>
<tr><td>Replatform</td><td>« Lift, tinker and shift » : petite optimisation (ex. BD → RDS)</td></tr>
<tr><td>Refactor / Re-architect</td><td>Réécrire en cloud-native (serverless, microservices)</td></tr>
<tr><td>Repurchase</td><td>« Drop and shop » : passer à un SaaS</td></tr>
<tr><td>Relocate</td><td>Déplacer un environnement VMware vers VMware Cloud on AWS</td></tr>
<tr><td>Retain</td><td>Garder sur site pour l’instant</td></tr>
<tr><td>Retire</td><td>Supprimer ce qui ne sert plus</td></tr></table>
<p><b>Outils de migration</b> : AWS Migration Hub (suivi), Application Migration Service (serveurs), Database Migration Service — <b>DMS</b> (BD, source reste active ; avec <i>Schema Conversion Tool</i> pour changer de moteur), <b>Snow Family</b> (Snowcone, Snowball Edge : transfert physique de téraoctets/pétaoctets quand le réseau est trop lent), DataSync (transfert en ligne), Transfer Family (SFTP).</p>

<h3>Économie du cloud</h3><ul>
<li><b>Coûts fixes</b> (sur site : serveurs, locaux, électricité) vs <b>coûts variables</b> (cloud).</li>
<li>Coûts cachés sur site : refroidissement, sécurité physique, personnel, licences.</li>
<li><b>Rightsizing</b> = choisir la bonne taille d’instance (outil : Compute Optimizer).</li>
<li>Licences : <b>BYOL</b> (apporter vos licences) ou licences incluses. Licences par socket/cœur → <b>Dedicated Hosts</b>.</li>
<li>Automatisation (CloudFormation) et services managés → moins de personnel d’exploitation.</li></ul>
</div>`;

<div class="card"><h2>Domaine 2 · Sécurité et conformité <span class="pill">30 %</span></h2>
<h3>Modèle de responsabilité partagée ⭐⭐⭐</h3>
<table><tr><th>AWS : sécurité <u>DU</u> cloud</th><th>Client : sécurité <u>DANS</u> le cloud</th></tr>
<tr><td>Matériel, datacenters, sécurité physique, réseau global, hyperviseur, infrastructure des régions/AZ/edge, logiciels des services managés</td><td>Données (et leur chiffrement), IAM (utilisateurs, permissions, MFA), OS invité d’EC2 (correctifs !), applications, configuration des security groups, chiffrement côté client, trafic réseau</td></tr></table>
<p><b>Ça varie selon le service</b> :</p><ul>
<li><b>EC2</b> (IaaS) : le client patche l’OS et le logiciel.</li>
<li><b>RDS</b> : AWS patche l’OS et le moteur BD ; le client gère les accès, données, sauvegardes configurées.</li>
<li><b>Lambda, S3, DynamoDB</b> : AWS gère presque tout ; le client gère code, données, permissions.</li></ul>
<p><b>Contrôles partagés</b> : gestion des correctifs, gestion de la configuration, sensibilisation et formation (chacun pour sa couche). <b>Contrôles hérités</b> : contrôles physiques et environnementaux (100 % AWS).</p>

<h3>IAM (Identity and Access Management) — global, gratuit</h3>
<table><tr><th>Élément</th><th>Rôle</th></tr>
<tr><td>Utilisateur root</td><td>Créé avec le compte, accès total. Activer <b>MFA</b>, ne pas l’utiliser au quotidien, pas de clés d’accès.</td></tr>
<tr><td>Utilisateur IAM</td><td>Une personne ou application, identifiants à long terme</td></tr>
<tr><td>Groupe</td><td>Ensemble d’utilisateurs qui partagent des permissions (pas de groupes imbriqués)</td></tr>
<tr><td>Rôle</td><td>Identité <b>temporaire</b> endossée par un service (ex. EC2 → S3), un autre compte ou un utilisateur fédéré. Meilleure pratique plutôt que des clés dans le code.</td></tr>
<tr><td>Politique (policy)</td><td>Document JSON qui autorise/refuse des actions. Un <i>Deny</i> explicite l’emporte toujours.</td></tr></table>
<p><b>Tâches réservées au root</b> : changer les paramètres du compte (email, nom, mot de passe root), changer de <b>plan de support</b>, <b>fermer le compte</b>, restaurer les permissions d’un admin IAM, s’inscrire comme vendeur Marketplace, certains réglages de facturation.</p>
<p><b>Principes</b> : moindre privilège · MFA · rotation des identifiants · politique de mots de passe · <b>IAM Access Analyzer</b> (accès externes) · <b>IAM Identity Center</b> (ex-SSO : connexion unique à plusieurs comptes) · clés d’accès = CLI/SDK.</p>

<h3>Multi-comptes</h3><ul>
<li><b>AWS Organizations</b> : gérer plusieurs comptes, <b>facturation consolidée</b> (une facture, remises de volume partagées), <b>SCP</b> (Service Control Policies : limite maximale de permissions d’un compte, même pour le root du compte membre), OU (unités d’organisation).</li>
<li><b>AWS Control Tower</b> : met en place une <i>landing zone</i> multi-comptes sécurisée selon les bonnes pratiques.</li>
<li><b>AWS RAM</b> : partager des ressources entre comptes.</li></ul>

<h3>Services de sécurité — « quel service pour quel besoin »</h3>
<table><tr><th>Service</th><th>À retenir</th></tr>
<tr><td><b>GuardDuty</b></td><td>Détection intelligente de <b>menaces</b> (ML) à partir de CloudTrail, VPC Flow Logs, DNS. Comportements malveillants.</td></tr>
<tr><td><b>Inspector</b></td><td>Scan automatique de <b>vulnérabilités</b> (CVE) sur EC2, images ECR, Lambda.</td></tr>
<tr><td><b>Macie</b></td><td>Découvre les <b>données sensibles (PII)</b> dans <b>S3</b> par ML.</td></tr>
<tr><td><b>Detective</b></td><td><b>Enquête</b> sur la cause racine d’un incident de sécurité.</td></tr>
<tr><td><b>Security Hub</b></td><td>Tableau de bord <b>centralisé</b> des alertes de sécurité + contrôles de conformité.</td></tr>
<tr><td><b>Shield</b></td><td>Protection <b>DDoS</b>. Standard = gratuit et automatique. Advanced = payant, équipe de réponse DDoS (SRT) 24/7, protection des coûts.</td></tr>
<tr><td><b>WAF</b></td><td>Pare-feu applicatif web (couche 7) : bloque <b>injection SQL, XSS</b>, IP, géo. Sur CloudFront, ALB, API Gateway.</td></tr>
<tr><td><b>Firewall Manager</b></td><td>Gérer les règles WAF/Shield/SG sur toute l’organisation.</td></tr>
<tr><td><b>Network Firewall</b></td><td>Pare-feu réseau managé pour le VPC.</td></tr>
<tr><td><b>KMS</b></td><td>Créer/gérer des <b>clés de chiffrement</b> (multi-locataire, intégré aux services).</td></tr>
<tr><td><b>CloudHSM</b></td><td>Module matériel (HSM) <b>dédié</b>, mono-locataire, vous contrôlez les clés (FIPS 140-2/3 niveau 3).</td></tr>
<tr><td><b>Secrets Manager</b></td><td>Stocker des secrets (mots de passe BD) avec <b>rotation automatique</b>. (Parameter Store = alternative simple sans rotation native.)</td></tr>

/* ============ RENDU ============ */
const app = document.getElementById('app');
const store = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DN = {1:"Concepts cloud",2:"Sécurité",3:"Technologies",4:"Facturation"};

function show(v){
  const navKey = v.startsWith('ch-')?'cours':v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===navKey));
  if(V[v]) app.innerHTML = V[v];
  else if(v==='cours') coursList();
  else if(v.startsWith('ch-')) chapter(+v.slice(3));
  else if(v==='flash') flash();
  else if(v==='quiz') quizHome();
  else if(v==='equipe') team();
  else if(v==='toutes') allQ();
  window.scrollTo(0,0);
}
document.getElementById('nav').onclick = e=>{const v=e.target.dataset.v; if(v){location.hash=v;}};
window.addEventListener('hashchange',()=>show(location.hash.slice(1)||'cours'));

/* Flashcards */
let fcI=0, fcFlip=false, fcOrder=[...FC.keys()];
function flash(){
  const [f,b]=FC[fcOrder[fcI]];
  app.innerHTML = `<div class="card"><h2>Flashcards <span class="mute">(${fcI+1}/${FC.length})</span></h2>
  <p class="mute">Cliquez sur la carte pour la retourner.</p>
  <div class="card fc" id="fc">${fcFlip?'<b>'+b+'</b>':f}</div>
  <div class="row"><button class="btn" id="pv">← Précédente</button><button class="btn p" id="nx">Suivante →</button><button class="btn" id="sh">Mélanger</button></div></div>`;
  fcEl('fc').onclick=()=>{fcFlip=!fcFlip;flash()};
  fcEl('pv').onclick=()=>{fcI=(fcI-1+FC.length)%FC.length;fcFlip=false;flash()};
  fcEl('nx').onclick=()=>{fcI=(fcI+1)%FC.length;fcFlip=false;flash()};
  fcEl('sh').onclick=()=>{fcOrder=shuffle([...FC.keys()]);fcI=0;fcFlip=false;flash()};
}
function fcEl(id){return document.getElementById(id)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* Quiz */
let S=null;
function quizHome(){
  const best=store.get('clf_best',null);
  const counts=[1,2,3,4].map(d=>Q.filter(q=>q.d===d).length);
  app.innerHTML=`<div class="card"><h2>Examen blanc</h2>
  <p>${Q.length} questions de synthèse (+ ${allChQ().length} questions dans les quiz de chapitres). Après chaque réponse : pourquoi votre choix est bon ou mauvais, et pourquoi <b>chaque</b> autre option l’est.</p>
  <div class="row" style="margin:12px 0"><label>Domaine : <select id="dom">
    <option value="0">Tous (${Q.length})</option>${[1,2,3,4].map(d=>`<option value="${d}">${d} · ${DN[d]} (${counts[d-1]})</option>`).join('')}
  </select></label>
  <label><input type="checkbox" id="onlyMiss"> Seulement mes erreurs passées, examen + chapitres (${store.get('clf_miss',[]).length})</label></div>
  <button class="btn p" id="go">Commencer</button>
  ${best!==null?`<p class="mute" style="margin-top:12px">Meilleur score (examen complet) : ${best} %</p>`:''}
  <div class="tip">Objectif : ≥ 80 % ici avant l’examen réel (la note de passage équivaut à environ 70 %).</div></div>`;
  fcEl('go').onclick=()=>{
    const d=+fcEl('dom').value, miss=store.get('clf_miss',[]);
    const only=fcEl('onlyMiss').checked;
    let qs=Q.map((q,i)=>({...q,key:'q'+i}));
    if(only) qs=[...qs,...allChQ()].filter(q=>miss.includes(q.key));
    qs=qs.filter(q=>!d||q.d===d);
    if(!qs.length){fcEl('go').insertAdjacentHTML('afterend',' <span class="mute">Aucune question ne correspond.</span>');return}
    S={qs:shuffle(qs),i:0,sel:[],done:false,res:[],full:!d&&!only};
    ask();
  };
}
function ask(){
  const q=S.qs[S.i], qi=q.key, multi=q.a.length>1;
  const pct=Math.round(S.i/S.qs.length*100);
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">${q.ch?'Chapitre '+q.ch+' · ':''}Domaine ${q.d} · ${DN[q.d]}</span><span class="mute">Question ${S.i+1} / ${S.qs.length}</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <p style="font-size:1.05rem"><b>${q.q}</b></p>${multi?'<p class="mute">Choisissez '+q.a.length+' réponses.</p>':''}`;
  q.o.forEach((o,k)=>{
    let cls='opt';
    if(S.done){ if(q.a.includes(k)) cls+=' good'; else if(S.sel.includes(k)) cls+=' bad'; }
    else if(S.sel.includes(k)) cls+=' sel';
    const L=String.fromCharCode(65+k);
    h+=`<button class="${cls}" data-k="${k}"><b>${L}.</b> ${o}`;
    if(S.done){
      const ok=q.a.includes(k), picked=S.sel.includes(k);
      h+=`<div class="ex">${ok?'<b class="g">✓ Bonne réponse'+(picked?' (vous l’avez choisie)':' (vous ne l’avez pas choisie)')+'</b>':'<b class="r">✗ Incorrecte'+(picked?' (votre choix)':'')+'</b>'} — ${q.e[k]}</div>`;
    }
    h+=`</button>`;
  });
  if(S.done){
    const good=S.res[S.res.length-1];
    h+=`<div class="verdict ${good?'g':'r'}">${good?'Bravo, c’est juste !':'Pas tout à fait. Bonne(s) réponse(s) : '+q.a.map(k=>String.fromCharCode(65+k)).join(' et ')}</div>
    <p class="mute">À revoir : ${q.ch?'<a href="#ch-'+q.ch+'">chapitre '+q.ch+'</a>':'onglet « '+q.d+' · '+DN[q.d]+' »'}${good?'':' et l’onglet Pièges'}.</p>
    <div class="row"><button class="btn p" id="next">${S.i+1<S.qs.length?'Question suivante →':'Voir mon résultat'}</button></div>`;
  } else {
    h+=`<div class="row" style="margin-top:8px"><button class="btn p" id="val" ${S.sel.length!==q.a.length?'disabled':''}>Valider</button></div>`;
  }
  app.innerHTML=h+'</div>';
  if(!S.done){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;
      if(multi){ S.sel=S.sel.includes(k)?S.sel.filter(x=>x!==k):(S.sel.length<q.a.length?[...S.sel,k]:S.sel); }
      else S.sel=[k];
      ask();
    });
    fcEl('val').onclick=()=>{
      const good=S.sel.length===q.a.length&&S.sel.every(k=>q.a.includes(k));
      S.res.push(good); S.done=true;
      let miss=store.get('clf_miss',[]);
      miss=good?miss.filter(x=>x!==qi):[...new Set([...miss,qi])];
      store.set('clf_miss',miss);
      ask();
    };
  } else {
    fcEl('next').onclick=()=>{S.i++;S.sel=[];S.done=false; S.i<S.qs.length?ask():result();};
  }
  window.scrollTo(0,0);
}
function result(){
  const tot=S.res.filter(Boolean).length, pct=Math.round(tot/S.qs.length*100);
  if(S.chap){const done=store.get('clf_ch',{}); done[S.chap]=Math.max(done[S.chap]||0,pct); store.set('clf_ch',done);}
  if(S.full){const b=store.get('clf_best',null); if(b===null||pct>b) store.set('clf_best',pct);}
  store.set('clf_n',store.get('clf_n',0)+1); syncProg();
  const byD={};S.qs.forEach((qq,n)=>{const d=qq.d;byD[d]=byD[d]||[0,0];byD[d][1]++;if(S.res[n])byD[d][0]++;});
  const pass=pct>=80?'Prêt(e) ! Continuez à réviser les erreurs et faites les questions officielles.':pct>=70?'Proche du seuil : retravaillez les domaines les plus faibles ci-dessous.':'Pas encore prêt(e) : relisez les fiches des domaines faibles, puis recommencez.';
  app.innerHTML=`<div class="card"><h2>Résultat : ${tot} / ${S.qs.length} (${pct} %)</h2>
  <div class="bar"><i style="width:${pct}%"></i></div><p>${pass}</p>
  <table><tr><th>Domaine</th><th>Score</th></tr>${Object.keys(byD).sort().map(d=>`<tr><td>${d} · ${DN[d]}</td><td>${byD[d][0]} / ${byD[d][1]} (${Math.round(byD[d][0]/byD[d][1]*100)} %)</td></tr>`).join('')}</table>
  <div class="row" style="margin-top:12px"><button class="btn p" id="again">Recommencer</button>${S.chap&&S.chap<CH.length?'<a class="btn" href="#ch-'+(S.chap+1)+'">Chapitre suivant →</a>':''}${S.chap?'<a class="btn" href="#cours">Liste des chapitres</a>':''}</div>
  <p class="mute">Vos erreurs sont mémorisées : cochez « Seulement mes erreurs passées » pour les retravailler.</p></div>`;
  const ch=S.chap; fcEl('again').onclick=()=>ch?startChapQuiz(ch):quizHome();
}
/* ============ TOUTES LES QUESTIONS (une par page) ============ */
let AQ={src:'all',txt:'',i:0,shown:false,pick:null};
function allQ(){
  const L='ABCDEFGH';
  const bank=[...allChQ().map(q=>({...q,src:'ch'+q.ch,lab:'Chapitre '+q.ch+' · '+CH.find(c=>c.n===q.ch).t})),
              ...Q.map((q,i)=>({...q,src:'exam',lab:'Examen blanc · Q'+(i+1)}))];
  const opts=`<option value="all">Toutes (${bank.length})</option><option value="exam">Examen blanc (${Q.length})</option>
   ${[1,2,3,4].map(d=>`<option value="d${d}">Domaine ${d} · ${DN[d]}</option>`).join('')}
   ${CH.map(c=>`<option value="ch${c.n}">Chapitre ${c.n} · ${c.t}</option>`).join('')}`;
  app.innerHTML=`<div class="card"><h2>📝 Toutes les questions, une par page</h2>
  <p>Les ${bank.length} questions du cours (${allChQ().length} des chapitres + ${Q.length} de l’examen blanc). Clique sur une option pour répondre : la bonne réponse et l’explication de <b>chaque</b> option s’affichent. Ensuite, passe à la suivante.</p>
  <div class="row"><select id="aqs" class="btn">${opts}</select>
  <input id="aqt" class="btn" placeholder="Rechercher (ex. S3, IAM, Multi-AZ)…" style="flex:1;min-width:200px"></div></div>
  <div class="card" id="aql"></div>`;
  const sel=fcEl('aqs'),txt=fcEl('aqt');
  sel.value=AQ.src; txt.value=AQ.txt;
  let list=[];
  const filt=()=>{const t=AQ.txt.trim().toLowerCase();
    list=bank.filter(q=>(AQ.src==='all'||q.src===AQ.src||(AQ.src[0]==='d'&&'d'+q.d===AQ.src))
      &&(!t||(q.q+' '+q.o.join(' ')+' '+q.e.join(' ')).toLowerCase().includes(t)));
    if(AQ.i>=list.length) AQ.i=0;};
  const go=i=>{AQ.i=Math.max(0,Math.min(list.length-1,i));AQ.shown=false;AQ.pick=null;draw();window.scrollTo(0,0);};
  const draw=()=>{
    const box=fcEl('aql');
    if(!list.length){box.innerHTML='<p>Aucune question ne correspond.</p>';return}
    const q=list[AQ.i], sh=AQ.shown, pct=Math.round((AQ.i+1)/list.length*100);
    box.innerHTML=`<div class="row" style="justify-content:space-between"><span class="pill">${q.lab} · Domaine ${q.d}</span><span class="mute">Question ${AQ.i+1} / ${list.length}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <p style="font-size:1.08rem"><b>${q.q}</b>${q.a.length>1?' <span class="mute">('+q.a.length+' réponses)</span>':''}</p>
      ${q.o.map((o,k)=>{let c='opt';if(sh){if(q.a.includes(k))c+=' good';else if(AQ.pick===k)c+=' bad';}
        return `<button class="${c}" data-k="${k}"><b>${L[k]}.</b> ${o}${sh?`<div class="ex">${q.a.includes(k)?'<b class="g">✓ Correcte</b>':'<b class="r">✗ Incorrecte</b>'} — ${q.e[k]}</div>`:''}</button>`}).join('')}
      ${sh&&AQ.pick!==null?`<p class="verdict ${q.a.includes(AQ.pick)?'g':'r'}">${q.a.includes(AQ.pick)?'✓ Bravo, bonne réponse !':'✗ Pas tout à fait. Bonne réponse : '+q.a.map(k=>L[k]).join(' + ')}</p>`:''}
      <div class="row" style="margin-top:12px">
      <button class="btn" id="aqp" ${AQ.i===0?'disabled':''}>← Précédente</button>
      ${sh?'':'<button class="btn" id="aqv">Voir la réponse</button>'}
      <button class="btn p" id="aqn" ${AQ.i>=list.length-1?'disabled':''}>Suivante →</button>
      <span class="mute">Aller à : <input id="aqg" type="number" min="1" max="${list.length}" value="${AQ.i+1}" class="btn" style="width:80px;padding:5px"></span></div>
      <p class="mute">Astuce clavier : ← et → pour changer de question.</p>`;
    box.querySelectorAll('.opt').forEach(bt=>bt.onclick=()=>{if(AQ.shown)return;AQ.pick=+bt.dataset.k;AQ.shown=true;draw();});
    fcEl('aqp').onclick=()=>go(AQ.i-1); fcEl('aqn').onclick=()=>go(AQ.i+1);
    if(fcEl('aqv')) fcEl('aqv').onclick=()=>{AQ.shown=true;draw();};
    fcEl('aqg').onchange=e=>go((+e.target.value||1)-1);
  };
  sel.onchange=()=>{AQ.src=sel.value;AQ.i=0;AQ.shown=false;AQ.pick=null;filt();draw();};
  txt.oninput=()=>{AQ.txt=txt.value;AQ.i=0;AQ.shown=false;AQ.pick=null;filt();draw();};
  document.onkeydown=e=>{if(location.hash!=='#toutes'||/INPUT|SELECT/.test(e.target.tagName))return;
    if(e.key==='ArrowRight')go(AQ.i+1); else if(e.key==='ArrowLeft')go(AQ.i-1);};
  filt(); draw();
}
/* ============ PROGRESSION PARTAGÉE ============ */
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DB=null, USR=null, ME=null, TEAM=[], PROF={}, tState='load', tNote='', canWrite=true, wBusy=false, wAgain=false;
function myProg(){return {ch:store.get('clf_ch',{}),best:store.get('clf_best',null),miss:store.get('clf_miss',[]).length,n:store.get('clf_n',0),upd:Date.now()}}
async function syncProg(){
  if(!DB||!ME||!canWrite) return;
  if(wBusy){wAgain=true;return}
  wBusy=true;
  try{await DB.doc('progress/'+ME).set(myProg())}
  catch(e){ if(e&&e.code==='invalid_argument'){canWrite=false; tNote='ro';} else if(e&&e.code==='unavailable'){setTimeout(syncProg,1500+Math.random()*2000)} console.log('[clf] sync',e&&e.code); }
  wBusy=false;
  if(wAgain){wAgain=false;syncProg()}
  if(location.hash==='#equipe') team();
}
function num(x){x=Number(x);return isFinite(x)?Math.max(0,Math.min(100,Math.round(x))):null}
function clean(d){const ch={};const src=(d&&typeof d.ch==='object'&&d.ch)||{};for(let i=1;i<=CH.length;i++){const v=num(src[i]);if(v!==null&&src[i]!==undefined)ch[i]=v}
  return {ch,best:d&&d.best!=null?num(d.best):null,miss:Math.max(0,Number(d&&d.miss)||0),n:Math.max(0,Number(d&&d.n)||0),upd:Number(d&&d.upd)||0}}
(async()=>{
  try{DB=await claude.use('db'); USR=await claude.use('user');}catch(e){}
  if(!DB||!USR){tState='off'; if(location.hash==='#equipe') team(); return}
  try{ME=await USR.id()}catch(e){}
  if(!ME){tState='off'; if(location.hash==='#equipe') team(); return}
  try{ if(USR.can){const c=await USR.can('data.write'); if(c===false){canWrite=false; tNote='ro';}} }catch(e){}
  // récupère ma progression enregistrée (autre appareil) et fusionne avec ce navigateur
  try{
    const snap=await DB.doc('progress/'+ME).get();
    if(snap.exists){
      const r=clean(snap.data()), loc=store.get('clf_ch',{});
      for(const k in r.ch) loc[k]=Math.max(loc[k]||0,r.ch[k]);
      store.set('clf_ch',loc);
      const b=store.get('clf_best',null); if(r.best!=null&&(b===null||r.best>b)) store.set('clf_best',r.best);
      if(r.n>store.get('clf_n',0)) store.set('clf_n',r.n);
    }
  }catch(e){}
  syncProg();
  const timer=setTimeout(()=>{if(tState==='load'){tState='slow'; if(location.hash==='#equipe') team();}},10000);
  DB.collection('progress').onSnapshot(async q=>{
    if(!q.metadata.fromCache) clearTimeout(timer);
    TEAM=q.docs.filter(d=>d.exists).map(d=>({id:d.id,...clean(d.data())}));
    tState=q.metadata.fromCache?'cache':'ok';
    try{PROF=await USR.profiles(TEAM.map(t=>t.id))||{}}catch(e){}
    const h=location.hash; if(h==='#equipe') team(); else if(h==='#cours'||h==='') coursList();
  },e=>{clearTimeout(timer); tState='err'; console.log('[clf] snapshot',e&&e.code); if(location.hash==='#equipe') team();});
})();
function pname(id){return (PROF[id]&&PROF[id].name)||'Quelqu’un'}
function cell(v){if(v===undefined) return '<td class="c0">·</td>'; const c=v>=80?'cg':v>=50?'cm':'cb'; return `<td class="${c}">${v}</td>`}
function team(){
  if(location.hash!=='#equipe') return;
  const intro=`<div class="card"><h2>👥 Progression partagée</h2>
  <p>Chaque personne qui ouvre ce lien voit la progression de tout le monde, <b>en direct</b> : chapitres terminés, score de chaque quiz et meilleur examen blanc. Ta progression s’enregistre toute seule à la fin de chaque quiz.</p>
  <p class="mute">Vert ≥ 80 % (niveau examen) · orange 50–79 % · rouge &lt; 50 % · « · » = pas encore fait.</p></div>`;
  if(tState==='off'){app.innerHTML=intro+`<div class="card"><p>⚠️ Le partage n’est pas disponible ici (il faut ouvrir la page sur claude.ai en étant connecté). Ta progression reste enregistrée dans ce navigateur.</p></div>`;return}
  if(tState==='load'){app.innerHTML=intro+`<div class="card"><p class="mute">Chargement de la progression…</p></div>`;return}
  let warn='';
  if(tState==='slow') warn='<p class="mute">⏳ Les données partagées ne répondent pas encore. Réessaie dans un moment.</p>';
  if(tState==='err') warn='<p class="mute">⚠️ Connexion aux données partagées perdue. Recharge la page.</p>';
  if(tState==='cache') warn='<p class="mute">Données peut-être pas à jour (mise à jour en cours)…</p>';
  if(tNote==='ro') warn+='<p class="tip">Tu peux voir la progression des autres, mais <b>la tienne ne peut pas être enregistrée</b> : le propriétaire de la page doit te donner l’accès <b>« Éditeur »</b> dans le menu Partager.</p>';
  const ppl=[...TEAM].sort((a,b)=>(a.id===ME?-1:b.id===ME?1:Object.keys(b.ch).length-Object.keys(a.ch).length));
  if(!ppl.length){app.innerHTML=intro+`<div class="card">${warn}<p>Personne n’a encore terminé de quiz. Fais le quiz d’un chapitre pour apparaître ici !</p></div>`;return}
  const nm=p=>`<span class="${p.id===ME?'me':''}">${esc(pname(p.id))}${p.id===ME?' (moi)':''}</span>`;
  const summary=ppl.map(p=>{const v=Object.values(p.ch),n=v.length,avg=n?Math.round(v.reduce((a,b)=>a+b,0)/n):0,ok=v.filter(x=>x>=80).length;
    const when=p.upd?new Date(p.upd).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'–';
    return `<div class="card" style="margin:0"><h3 style="margin-top:0">${nm(p)}</h3>
    <div class="bar"><i style="width:${Math.round(n/CH.length*100)}%"></i></div>
    <p><b>${n} / ${CH.length}</b> chapitres faits · <b>${ok}</b> réussis à ≥ 80 %<br>Moyenne des quiz : <b>${avg} %</b><br>Meilleur examen blanc : <b>${p.best!=null?p.best+' %':'pas encore'}</b><br>Questions à retravailler : ${p.miss} · Quiz terminés : ${p.n}</p>
    <p class="mute">Dernière activité : ${when}</p></div>`}).join('');
  const grid=`<div class="tw"><table class="tg"><tr><th>Chapitre</th>${ppl.map(p=>`<th>${nm(p)}</th>`).join('')}</tr>
  ${CH.map(c=>`<tr><td class="t"><a href="#ch-${c.n}">${c.n}. ${c.t}</a></td>${ppl.map(p=>cell(p.ch[c.n])).join('')}</tr>`).join('')}</table></div>`;
  app.innerHTML=intro+`<div class="card">${warn}<div class="chl">${summary}</div></div>
  <div class="card"><h2>Chapitre par chapitre (score du quiz en %)</h2><p class="mute">Astuce : un chapitre vert chez ton ami et rouge chez toi ? Demande-lui de te l’expliquer, et inversement.</p>${grid}</div>`;
}
/* Cours par chapitre */
CH.sort((a,b)=>a.n-b.n);
/* questions supplémentaires : couverture complète de chaque chapitre */
function mixQ(q,o,a,e){ /* mélange fixe (même ordre à chaque visite) ; chaque explication suit son option */
  let h=0;for(const ch of q)h=(h*31+ch.charCodeAt(0))|0;
  const rnd=()=>{h=(h*1103515245+12345)|0;return ((h>>>16)&0x7fff)/0x8000};
  const idx=o.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  const tidy=x=>{x=x.replace(/^(Exact|Faux)\s*:\s*/,'');return x.charAt(0).toUpperCase()+x.slice(1)};
  return {q,o:idx.map(i=>o[i]),e:idx.map(i=>tidy(e[i])),a:a.map(k=>idx.indexOf(k)).sort((x,y)=>x-y)};
}
CH.forEach(c=>{const x=(window.QX||{})[c.n]; if(x) c.q=c.q.concat(x.map(([q,o,a,e])=>mixQ(q,o,a,e)));});
function allChQ(){return CH.flatMap(c=>c.q.map((q,k)=>({...q,d:c.d,ch:c.n,key:'c'+c.n+'-'+k})))}
function coursList(){
  const done=store.get('clf_ch',{});
  const n=Object.keys(done).length;
  app.innerHTML=`<div class="card"><h2>Cours complet : de zéro à pro</h2>
  <p>29 chapitres, dans l’ordre de tes vidéos (dossier <code>Downloads\AWS</code>). Chaque chapitre a 3 niveaux :</p>
  <p>🟢 <b>Niveau zéro</b> : l’idée avec une analogie · 🟡 <b>Niveau examen</b> : ce qu’il faut savoir · 🔴 <b>Niveau pro</b> : détails, pièges et scénarios</p>
  <p>puis un <b>mini-quiz expliqué</b>. Méthode : vidéo résumé → lecture des 3 niveaux → quiz → chapitre suivant. À la fin : onglet <a href="#quiz">Examen blanc</a>.</p>
  <div class="bar"><i style="width:${Math.round(n/CH.length*100)}%"></i></div><p class="mute">${n} / ${CH.length} chapitres avec quiz terminé</p></div>
  <div class="chl">${CH.map(c=>`<a href="#ch-${c.n}"><b>${c.n}.</b> ${c.t}<br><span class="mute">Domaine ${c.d} · ${DN[c.d]}</span> ${done[c.n]!==undefined?'<span class="ok">✓ '+done[c.n]+' %</span>':''}</a>`).join('')}</div>`;
}
function chapter(n){
  const c=CH.find(x=>x.n===n); if(!c){coursList();return}
  const prev=CH.find(x=>x.n===n-1), next=CH.find(x=>x.n===n+1);
  app.innerHTML=`<div class="card"><p class="mute"><a href="#cours">← Tous les chapitres</a></p>
  <h2>Chapitre ${c.n} · ${c.t}</h2>
  <p><span class="pill">Domaine ${c.d} · ${DN[c.d]}</span> &nbsp;<span class="mute">🎬 Vidéo résumé : <code>${c.v}</code></span></p></div>
  <div class="card lvl l0"><h2>🟢 Niveau zéro : comprendre l’idée</h2>${c.zero}</div>
  ${DG[c.n]?'<div class="card"><h2>📐 Schéma'+(DG[c.n].length>1?'s':'')+' explicatif'+(DG[c.n].length>1?'s':'')+'</h2>'+DG[c.n].map(svgDiag).join('')+'</div>':''}
  <div class="card lvl l1"><h2>🟡 Niveau examen : ce qu’il faut savoir</h2>${c.exam}</div>
  <div class="card lvl l2"><h2>🔴 Niveau pro : détails, pièges, scénarios</h2>${c.pro}</div>
  <div class="card"><h2>✅ Vérifie que tu as compris</h2><p>${c.q.length} questions, avec l’explication de chaque option.</p>
  <div class="row"><button class="btn p" id="cq">Faire le quiz du chapitre</button>
  ${prev?'<a class="btn" href="#ch-'+prev.n+'">← Ch. '+prev.n+'</a>':''}${next?'<a class="btn" href="#ch-'+next.n+'">Ch. '+next.n+' →</a>':''}</div></div>`;
  fcEl('cq').onclick=()=>startChapQuiz(n);
}
function startChapQuiz(n){
  S={qs:allChQ().filter(q=>q.ch===n),i:0,sel:[],done:false,res:[],full:false,chap:n};
  ask();
}
show(location.hash.slice(1)||'cours');
</script>
